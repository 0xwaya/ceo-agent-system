<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CEO Agent Login</title></head>
<body>
  <main>
    <h1>Private dashboard login</h1>
    <p>Accounts are provisioned by the operator. Public registration is disabled.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required maxlength="256" autocomplete="current-password"></label>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
