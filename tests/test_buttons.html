<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        .output-panel {
            background: #f0f0f0;
            padding: 20px;
            margin: 20px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Button Test Console</h1>
    <div id="output" class="output-panel">
        Waiting for test results...
    </div>

    <button onclick="testGraphExecution()">Test Launch Graph Execution</button>
    <button onclick="testExecuteAgent('branding')">Test Execute Branding Agent</button>
    <button onclick="testViewDetails('legal')">Test View Legal Agent Details</button>

    <script>
        const socket = io('http://localhost:5001');
        const output = document.getElementById('output');

        function log(message) {
            output.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
        }

        socket.on('connect', () => {
            log('✅ Socket connected');
        });

        socket.on('disconnect', () => {
            log('❌ Socket disconnected');
        });

        async function testGraphExecution() {
            log('🧪 Testing graph execution...');

            const payload = {
                company_name: 'Test Company',
                dba_name: 'Test DBA',
                industry: 'Technology',
                location: 'New York',
                objectives: ['Test objective 1', 'Test objective 2'],
            };

            try {
                const response = await fetch('http://localhost:5001/api/graph/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();
                log('✅ Graph execution response: ' + JSON.stringify(data).substring(0, 200));
            } catch (error) {
                log('❌ Graph execution error: ' + error.message);
            }
        }

        async function testExecuteAgent(agentType) {
            log('🧪 Testing execute agent: ' + agentType);

            try {
                const response = await fetch(`http://localhost:5001/api/agent/execute/${agentType}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        task: `Execute ${agentType} tasks`,
                        company_info: {
                            company_name: 'Test Company',
                            name: 'Test Company',
                            dba_name: 'Test DBA',
                            industry: 'Technology',
                            location: 'New York'
                        }
                    })
                });

                const data = await response.json();
                log('✅ Execute response: ' + JSON.stringify(data).substring(0, 200));
            } catch (error) {
                log('❌ Execute error: ' + error.message);
            }
        }

        async function testViewDetails(agentType) {
            log('🧪 Testing view details: ' + agentType);

            try {
                const response = await fetch(`http://localhost:5001/api/guard-rails/${agentType}`);
                const data = await response.json();
                log('✅ Guard rails response: ' + JSON.stringify(data).substring(0, 200));
            } catch (error) {
                log('❌ Guard rails error: ' + error.message);
            }
        }
    </script>
</body>
</html>
