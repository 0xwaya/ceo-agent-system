name: Code Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      BILLING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node for dashboard syntax regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r requirements-memory.txt

      - name: Black check
        run: black --check . --line-length 100

      - name: Flake8 check
        run: flake8 . --max-line-length=100 --exclude=.git,.venv,venv,__pycache__

      - name: Enforce docs/workflow consistency
        run: python3 tools/enforce_consistency_gate.py

      - name: Smoke dashboard rendering and UI template check
        run: python3 tools/smoke_dashboard_render.py

      - name: Check dashboard JavaScript syntax and task-routing UI assets
        run: |
          # Verify JavaScript syntax across frontend scripts
          node --check static/js/app.js
          node --check static/js/auth.js

      - name: Verify memberships, signed fulfillment and spending reservations offline
        run: |
          pytest -q tests/test_billing.py

      - name: Verify account onboarding, free-run boundaries and public website evidence
        run: |
          pytest -q tests/test_account_onboarding.py tests/test_website_service.py

      - name: Verify dashboard layout and styled controls
        run: pytest -q tests/test_v04_features.py::TestIndexHTMLV4Layout

      - name: Run offline tests including source-build and isolated-runner contracts
        run: pytest -q
